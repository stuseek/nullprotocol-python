[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nullprotocol"
version = "0.5.0"
description = "Focused AI tasks with managed context, Knowledge and observable results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "NullProtocol"}]
keywords = ["ai", "agents", "structured-output", "context", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema>=4.23"]

[project.urls]
Homepage = "https://nullprotocol.ai"
Documentation = "https://nullprotocol.ai/docs/python"
Repository = "https://github.com/stuseek/nullprotocol-python"
Issues = "https://github.com/stuseek/nullprotocol-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nullprotocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
